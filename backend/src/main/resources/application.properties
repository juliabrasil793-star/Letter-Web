spring.application.name=letterweb-backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:letterweb_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.type.json_format_mapper=com.letterweb.config.Jackson3JsonFormatMapper
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:publication-schema.sql
letterweb.proxy.trusted-ips=${TRUSTED_PROXY_IPS:}
server.forward-headers-strategy=framework
letterweb.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
